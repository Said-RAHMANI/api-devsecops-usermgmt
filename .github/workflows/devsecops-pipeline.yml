name: DevSecOps Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # JOB 1 : BUILD + SAST + SCA
  build:
    name: Build & Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      - name: Build with Maven
        run: mvn clean compile -DskipTests -B
      
      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.projectKey=said-rahmani_api-devsecops-usermgmt \
            -Dsonar.organization=said-rahmani \
            -Dsonar.java.binaries=target/classes
      
      - name: Build Docker Image
        run: |
          docker build -t api-devsecops-usermgmt:latest .
      
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: api-devsecops-usermgmt:latest
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
          output: trivy_report.txt
      
      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy_report
          path: trivy_report.txt

  # JOB 2 : DAST - OWASP ZAP
  dast:
    name: DAST - OWASP ZAP
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Start Application
        run: |
          docker compose up -d --build
          echo "Waiting for API to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/health > /dev/null 2>&1; then
              echo "API is ready!"
              break
            fi
            echo "Attempt $i/30..."
            sleep 5
          done
      
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
          cmd_options: '-J /zap/wrk/zap_report.json'
      
      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap_report
          path: /zap/wrk/zap_report.json
      
      - name: Stop Containers
        if: always()
        run: docker compose down -v

  # JOB 3 : REPORTING
  reporting:
    name: Security Reporting
    needs: [build, dast]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download All Reports
        uses: actions/download-artifact@v4
        if: always()
        with:
          path: reports/
      
      - name: Generate Security Summary
        run: |
          echo "# DevSecOps Pipeline Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| SAST | SonarCloud | Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| SCA | Trivy | Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| DAST | OWASP ZAP | Completed |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Generated Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Trivy report: trivy_report.txt" >> $GITHUB_STEP_SUMMARY
          echo "- ZAP DAST report: zap_report.json" >> $GITHUB_STEP_SUMMARY
          echo "- SonarCloud analysis: https://sonarcloud.io/project/overview?id=said-rahmani_api-devsecops-usermgmt" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload All Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devsecops_reports
          path: reports/
