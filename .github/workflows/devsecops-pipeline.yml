name: DevSecOps Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # JOB 1 : SETUP - Préparation de l'environnement
  setup:
    name: Setup & Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      - name: Download dependencies
        run: mvn dependency:go-offline -B

  # JOB 2 : SAST - SonarCloud (analyse statique)
  sast:
    name: SAST - SonarCloud
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      
      - name: Compile project
        run: mvn compile -DskipTests
      
      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.projectKey=said-rahmani_api-devsecops-usermgmt \
            -Dsonar.organization=said-rahmani \
            -Dsonar.java.binaries=target/classes

  # JOB 3 : SCA - Trivy (scan des dépendances)
  sca:
    name: SCA - Trivy
    needs: [setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
      
      - name: Run Trivy on Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'api-devsecops-usermgmt:latest'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  # JOB 4 : BUILD - Compilation et construction Docker
  build:
    name: Build & Container Scan
    needs: [sca]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
      
      - name: Build with Maven
        run: mvn clean package -DskipTests -B
      
      - name: Build Docker Image
        run: |
          docker build -t api-devsecops-usermgmt:${{ github.sha }} .
          docker tag api-devsecops-usermgmt:${{ github.sha }} api-devsecops-usermgmt:latest
      
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: api-devsecops-usermgmt:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          output: trivy-image-report.txt
      
      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-image-report.txt

  # JOB 5 : DAST - OWASP ZAP (tests dynamiques)
  dast:
    name: DAST - OWASP ZAP
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build and Start Application
        run: |
          docker compose up -d --build
          echo "Waiting for API to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:8080/health > /dev/null 2>&1; then
              echo "API is ready!"
              break
            fi
            echo "Attempt $i/30..."
            sleep 5
          done
      
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
          cmd_options: '-J zap-report.json -r zap-report.html'
          rules_file_name: ''
          allow_issue_writing: false
      
      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            zap-report.json
            zap-report.html
      
      - name: Teardown
        if: always()
        run: docker compose down -v

  # JOB 6 : REPORTING - Rapport final
  reporting:
    name: Security Reporting
    needs: [dast]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        if: always()
        with:
          path: reports/
      
      - name: Generate Security Summary
        run: |
          echo "# 📊 DevSecOps Pipeline Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Setup | Maven | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST | SonarCloud | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| SCA | Trivy | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | Docker + Trivy | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| DAST | OWASP ZAP | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Reporting | GitHub | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📁 Generated Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Trivy vulnerability report" >> $GITHUB_STEP_SUMMARY
          echo "- ZAP DAST report (JSON + HTML)" >> $GITHUB_STEP_SUMMARY
          echo "- SonarCloud analysis" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload All Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devsecops-reports
          path: reports/
