# ============================================================
# imagePullSecrets — authentification du cluster auprès de Harbor
#
# ⚠️ Ne committez JAMAIS un Secret docker-registry rempli avec de vraies
# valeurs : ce fichier est un GABARIT (".example.yaml") fourni pour
# documenter sa structure. Générez le vrai Secret directement en
# ligne de commande (il ne touche jamais le disque ni Git) :
#
#   kubectl create secret docker-registry harbor-registry-secret \
#     --namespace usermgmt \
#     --docker-server=<HARBOR_REGISTRY> \
#     --docker-username='robot$ci-pipeline' \
#     --docker-password='<HARBOR_TOKEN>' \
#     --docker-email='devsecops@example.com'
#
# Le Deployment de l'API (api-deployment.yaml) référence déjà ce secret
# via spec.template.spec.imagePullSecrets[0].name = harbor-registry-secret
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: harbor-registry-secret
  namespace: usermgmt
type: kubernetes.io/dockerconfigjson
data:
  # Produit automatiquement par `kubectl create secret docker-registry` ci-dessus.
  # Format brut équivalent (NE PAS éditer à la main) :
  #   { "auths": { "<HARBOR_REGISTRY>": { "username": "...", "password": "...", "auth": "<base64 user:pass>" } } }
  .dockerconfigjson: PLACEHOLDER_GENERATED_BY_KUBECTL_CREATE_SECRET
