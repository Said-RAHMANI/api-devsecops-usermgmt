# ============================================================
# API Spring Boot — usermgmt
# ConfigMap (paramètres non sensibles) + Secret (identifiants/JWT)
# + Deployment (2 réplicas, probes, limites de ressources, hardening)
# ============================================================

# ---------- ConfigMap : paramètres non sensibles ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: usermgmt
data:
  # Réutilise le même schéma de connexion que docker-compose.yml,
  # "postgres" étant le nom du Service Kubernetes ClusterIP défini dans services.yaml
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/usermgmt"
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"

---
# ---------- Secret : identifiants applicatifs ----------
# ⚠️ PLACEHOLDERS — à remplacer impérativement avant tout déploiement réel.
# Génération recommandée en ligne de commande (cf. section "Commandes" du rapport) :
#   kubectl create secret generic api-secret --namespace usermgmt \
#     --from-literal=DB_USERNAME=postgres \
#     --from-literal=DB_PASSWORD='change-me' \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 64)"
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: usermgmt
type: Opaque
data:
  DB_USERNAME: cG9zdGdyZXM=                                       # postgres
  DB_PASSWORD: cG9zdGdyZXM=                                       # postgres (À CHANGER)
  JWT_SECRET: Y0hKdmFtVmxMV1JsZG5ObFkyOXdjeTFyWlhCMWVTNXJaWGtnTW1JeU5DQT0= # placeholder (À CHANGER — clé ≥ 64 caractères)

---
# ---------- Deployment : API Spring Boot ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: usermgmt
  labels:
    app: usermgmt-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: usermgmt-api
  template:
    metadata:
      labels:
        app: usermgmt-api
      annotations:
        # Permet à Prometheus (cf. monitoring/prometheus-config.yaml) de découvrir le pod
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      # ----- Authentification auprès du registry privé Harbor (ÉTAPE 3) -----
      imagePullSecrets:
        - name: harbor-registry-secret
      # ----- Sécurité du Pod : exécution non-root -----
      # L'utilisateur "appuser" est créé via `addgroup -S && adduser -S` dans le Dockerfile
      # (UID système Alpine standard = 100). Vérifiez avec :
      #   docker run --rm api-devsecops-usermgmt:latest id appuser
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: api
          # Remplacez <HARBOR_REGISTRY> par l'URL réelle de votre instance Harbor
          # (ex: harbor.mondomaine.local/devsecops/api-devsecops-usermgmt:latest)
          image: <HARBOR_REGISTRY>/devsecops/api-devsecops-usermgmt:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          # ----- Sécurité du conteneur : moindre privilège -----
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # ----- Système de fichiers en lecture seule : volumes inscriptibles dédiés -----
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
          # ----- Limites de ressources -----
          resources:
            requests:
              cpu: "250m"
              memory: "384Mi"
            limits:
              cpu: "750m"
              memory: "768Mi"
          # ----- Probes basées sur Spring Boot Actuator (groupes liveness/readiness) -----
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
