# ============================================================
# NetworkPolicies — segmentation réseau "moindre privilège"
#
# Stratégie :
#   1. Tout refuser par défaut (deny-all ingress) dans le namespace "usermgmt"
#   2. Autoriser explicitement uniquement les flux nécessaires :
#        Internet/Ingress -> api  (port 8080)
#        api              -> postgres (port 5432)
#        api, postgres    -> kube-dns (résolution de noms, port 53)
#
# ⚠️ Nécessite un CNI qui implémente les NetworkPolicies
#    (Calico, Cilium... ; le CNI "flannel" par défaut de K3s ne les applique PAS —
#    installez Calico : `k3s server --flannel-backend=none --disable-network-policy`
#    puis `kubectl apply -f https://docs.projectcalico.org/manifests/calico.yaml`,
#    ou activez le plugin réseau Calico sur Minikube : `minikube start --cni=calico`)
# ============================================================

# ---------- 1. Refus par défaut de tout trafic entrant ----------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: usermgmt
spec:
  podSelector: {}        # s'applique à tous les pods du namespace
  policyTypes:
    - Ingress

---
# ---------- 2. PostgreSQL : n'accepte QUE le trafic venant de l'API ----------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-from-api-only
  namespace: usermgmt
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: usermgmt-api
      ports:
        - protocol: TCP
          port: 5432
  egress:
    # Résolution DNS (kube-dns / CoreDNS dans kube-system)
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# ---------- 3. API : accepte le trafic entrant (Service/Ingress) et ne parle qu'à Postgres + DNS ----------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow-ingress-and-egress
  namespace: usermgmt
spec:
  podSelector:
    matchLabels:
      app: usermgmt-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Autorise le trafic entrant vers le port 8080 (NodePort/Ingress/Prometheus)
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    # Vers PostgreSQL uniquement
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Résolution DNS
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
