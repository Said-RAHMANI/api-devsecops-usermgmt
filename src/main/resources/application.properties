spring.application.name=api-devsecops-usermgmt

# ─── Rate Limiting (Bucket4j) ─────────────────────────────────────────────────
rate-limit.login.capacity=5
rate-limit.login.refill-tokens=5
rate-limit.login.refill-period-seconds=60

rate-limit.register.capacity=3
rate-limit.register.refill-tokens=3
rate-limit.register.refill-period-seconds=60

rate-limit.forgot-password.capacity=3
rate-limit.forgot-password.refill-tokens=3
rate-limit.forgot-password.refill-period-seconds=60

# ─── Refresh Token ─────────────────────────────────────────────────────────────
# Access token: 15 minutes | Refresh token: 7 days
jwt.expiration=900000
jwt.refresh-token-expiration=604800000

spring.datasource.url=jdbc:postgresql://localhost:5432/usermgmt
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET}

server.port=8080

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ─── Actuator (Kubernetes probes + Prometheus scraping) ───────────────────────
# Only health and prometheus are exposed; everything else stays internal.
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
