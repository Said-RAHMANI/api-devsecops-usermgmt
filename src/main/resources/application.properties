spring.application.name=api-devsecops-usermgmt

# ─── Rate Limiting (Bucket4j) ─────────────────────────────────────────────────
rate-limit.login.capacity=5
rate-limit.login.refill-tokens=5
rate-limit.login.refill-period-seconds=60

rate-limit.register.capacity=3
rate-limit.register.refill-tokens=3
rate-limit.register.refill-period-seconds=60

rate-limit.forgot-password.capacity=3
rate-limit.forgot-password.refill-tokens=3
rate-limit.forgot-password.refill-period-seconds=60

# ─── Refresh Token ─────────────────────────────────────────────────────────────
# Access token: 15 minutes | Refresh token: 7 days
jwt.expiration=900000
jwt.refresh-token-expiration=604800000

spring.datasource.url=jdbc:postgresql://localhost:5432/usermgmt
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# INJ-01: hardcoded weak JWT secret (replaces ${JWT_SECRET})
jwt.secret=secret
jwt.expiration=86400000

server.port=8080

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
